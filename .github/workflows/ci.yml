name: netrise-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race test
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/netrise
      - name: Packaged bundle smoke flow
        shell: bash
        run: |
          bundle="$RUNNER_TEMP/netrise-bundle-smoke"
          rm -rf "$bundle"
          mkdir -p "$bundle/assets/content"
          if [ "${{ runner.os }}" = "Windows" ]; then exe="netrise.exe"; else exe="netrise"; fi
          go build -trimpath -o "$bundle/$exe" ./cmd/netrise
          cp assets/content/catalog.json "$bundle/assets/content/catalog.json"
          cd "$RUNNER_TEMP"
          "$bundle/$exe" --version
          "$bundle/$exe" --help
          "$bundle/$exe" corp --help
          "$bundle/$exe" simulate --help
          "$bundle/$exe" playtest --faction runner --seed 17
          "$bundle/$exe" playtest --faction corp --seed 17
          "$bundle/$exe" validate-content
          "$bundle/$exe" simulate --faction runner --seed 17 --ticks 600
          "$bundle/$exe" simulate --faction corp --seed 17 --ticks 600
          if "$bundle/$exe" unknown-command; then exit 1; fi
      - name: CLI smoke flow
        run: |
          go run ./cmd/netrise --version
          go run ./cmd/netrise validate-content
          go run ./cmd/netrise simulate --faction runner --seed 17 --ticks 600
          go run ./cmd/netrise simulate --faction corp --seed 17 --ticks 600
          go run ./cmd/netrise playtest --faction runner --seed 17
          go run ./cmd/netrise playtest --faction corp --seed 17
      - name: Install Fish
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y fish
      - name: Fish smoke flow
        if: runner.os == 'Linux'
        shell: fish {0}
        run: |
          go run ./cmd/netrise --version
          go run ./cmd/netrise validate-content
          go run ./cmd/netrise simulate --faction runner --seed 17 --ticks 600
          go run ./cmd/netrise simulate --faction corp --seed 17 --ticks 600
          go run ./cmd/netrise playtest --faction runner --seed 17
          go run ./cmd/netrise playtest --faction corp --seed 17
          if go run ./cmd/netrise unknown-command
            exit 1
          end
      - name: CMD smoke flow
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          go run ./cmd/netrise --version
          go run ./cmd/netrise validate-content
          go run ./cmd/netrise simulate --faction runner --seed 17 --ticks 600
          go run ./cmd/netrise simulate --faction corp --seed 17 --ticks 600
          go run ./cmd/netrise playtest --faction runner --seed 17
          go run ./cmd/netrise playtest --faction corp --seed 17
          go run ./cmd/netrise unknown-command
          if %ERRORLEVEL% EQU 0 exit /b 1
      - name: PowerShell smoke flow
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go run ./cmd/netrise --version
          go run ./cmd/netrise --help
          go run ./cmd/netrise corp --help
          go run ./cmd/netrise simulate --help
          go run ./cmd/netrise validate-content
          go run ./cmd/netrise simulate --faction runner --seed 17 --ticks 600
          go run ./cmd/netrise simulate --faction corp --seed 17 --ticks 600
          go run ./cmd/netrise playtest --faction runner --seed 17
          go run ./cmd/netrise playtest --faction corp --seed 17
          $previousErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          go run ./cmd/netrise unknown-command 2>&1 | Out-Host
          $unknownExitCode = $LASTEXITCODE
          $ErrorActionPreference = $previousErrorActionPreference
          if ($unknownExitCode -eq 0) { throw 'unknown command unexpectedly succeeded' }
