name: netrise-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race test
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/netrise
      - name: CLI smoke flow
        run: |
          go run ./cmd/netrise --version
          go run ./cmd/netrise validate-content
          go run ./cmd/netrise simulate --faction runner --seed 17 --ticks 600
          go run ./cmd/netrise simulate --faction corp --seed 17 --ticks 600
