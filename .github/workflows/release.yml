name: netrise-release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        shell: bash
        run: |
          mkdir -p dist
          suffix=""
          if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi
          name="netrise-${GOOS}-${GOARCH}${suffix}"
          bundle="${name}-bundle"
          mkdir -p "dist/${bundle}/assets/content"
          go build -trimpath -ldflags="-s -w" -o "dist/${bundle}/${name}" ./cmd/netrise
          cp assets/content/catalog.json "dist/${bundle}/assets/content/catalog.json"
          if [ "$GOOS" = "linux" ] && [ "$GOARCH" = "amd64" ]; then
            (cd "dist/${bundle}" && "./${name}" --version)
            (cd "dist/${bundle}" && "./${name}" --help)
            (cd "dist/${bundle}" && "./${name}" corp --help)
            (cd "dist/${bundle}" && "./${name}" simulate --help)
            (cd "dist/${bundle}" && "./${name}" playtest --faction runner --seed 17 >/dev/null)
            (cd "dist/${bundle}" && "./${name}" playtest --faction corp --seed 17 >/dev/null)
            (cd "dist/${bundle}" && "./${name}" validate-content)
            (cd "dist/${bundle}" && "./${name}" simulate --faction runner --seed 17 --ticks 600 >/dev/null)
            (cd "dist/${bundle}" && "./${name}" simulate --faction corp --seed 17 --ticks 600 >/dev/null)
            if (cd "dist/${bundle}" && "./${name}" unknown-command); then exit 1; fi
          fi
          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip -qr "${bundle}.zip" "${bundle}")
            (cd dist && sha256sum "${bundle}.zip" > "${bundle}.zip.sha256" && sha256sum -c "${bundle}.zip.sha256")
            archive="dist/${bundle}.zip"
          else
            tar -C dist -czf "dist/${bundle}.tar.gz" "${bundle}"
            (cd dist && sha256sum "${bundle}.tar.gz" > "${bundle}.tar.gz.sha256" && sha256sum -c "${bundle}.tar.gz.sha256")
            archive="dist/${bundle}.tar.gz"
          fi
          verify="${RUNNER_TEMP}/netrise-release-verify-${GOOS}-${GOARCH}"
          rm -rf "$verify"
          mkdir -p "$verify"
          if [ "$GOOS" = "windows" ]; then
            unzip -q "$archive" -d "$verify"
          else
            tar -xzf "$archive" -C "$verify"
          fi
          test -s "$verify/${bundle}/${name}"
          test -s "$verify/${bundle}/assets/content/catalog.json"
      - uses: actions/upload-artifact@v4
        with:
          name: netrise-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: netrise-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
