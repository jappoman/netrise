name: netrise-release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        shell: bash
        run: |
          mkdir -p dist
          suffix=""
          if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi
          name="netrise-${GOOS}-${GOARCH}${suffix}"
          go build -trimpath -ldflags="-s -w" -o "dist/${name}" ./cmd/netrise
          sha256sum "dist/${name}" > "dist/${name}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: netrise-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: netrise-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
