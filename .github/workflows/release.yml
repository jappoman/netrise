name: netrise-release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        shell: bash
        run: |
          mkdir -p dist
          suffix=""
          if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi
          name="netrise-${GOOS}-${GOARCH}${suffix}"
          bundle="${name}-bundle"
          mkdir -p "dist/${bundle}/assets/content"
          go build -trimpath -ldflags="-s -w" -o "dist/${bundle}/${name}" ./cmd/netrise
          cp assets/content/catalog.json "dist/${bundle}/assets/content/catalog.json"
          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip -qr "${bundle}.zip" "${bundle}")
            (cd dist && sha256sum "${bundle}.zip" > "${bundle}.zip.sha256" && sha256sum -c "${bundle}.zip.sha256")
          else
            tar -C dist -czf "dist/${bundle}.tar.gz" "${bundle}"
            (cd dist && sha256sum "${bundle}.tar.gz" > "${bundle}.tar.gz.sha256" && sha256sum -c "${bundle}.tar.gz.sha256")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: netrise-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: netrise-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
